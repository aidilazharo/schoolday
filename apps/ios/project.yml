name: Schoolday
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Schoolday:
    type: application
    platform: iOS
    sources: [Schoolday]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoolday.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Schoolday
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  SchooldayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SchooldayTests]
    dependencies:
      - target: Schoolday
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schoolday.app.tests
schemes:
  Schoolday:
    build:
      targets:
        Schoolday: all
    test:
      targets: [SchooldayTests]
