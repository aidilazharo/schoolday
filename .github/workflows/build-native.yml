name: Native build checks
on:
  push:
    branches: [main]
    paths: ['apps/ios/**', 'apps/android/**', 'shared/**', '.github/workflows/build-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p apps/android :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: schoolday-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: apps/ios
        run: xcodegen generate
      - working-directory: apps/ios
        run: xcodebuild -project Schoolday.xcodeproj -scheme Schoolday -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
