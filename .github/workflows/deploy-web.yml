name: Web test and Pages
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'shared/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schoolday-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, test and build
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
